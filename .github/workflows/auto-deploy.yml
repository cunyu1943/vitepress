# 构建 VitePress 站点并自动部署到 GitHub Pages
#
# 触发条件：推送到 main 分支（即你要求的"推送到远程后自动部署"）
name: 🚀 Deploy VitePress site to GitHub Pages

on:
  # 推送到 main 分支时自动运行（如需其他分支请修改）
  push:
    branches: [main]
  # 允许从 Actions 选项卡手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # 启用 lastUpdated / Git 变更日志需要完整历史

      - name: 🔧 Enable Corepack
        # 启用 corepack，自动使用 package.json 中 packageManager 锁定的 pnpm 版本（当前 10.3.0）
        run: corepack enable

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build with VitePress
        run: pnpm docs:build

      - name: ⬆️ Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  # 部署任务
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 🎉 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
