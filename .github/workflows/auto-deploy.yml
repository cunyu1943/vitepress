# 构建 VitePress 站点并自动部署到 GitHub Pages
#
# 触发条件：推送到 main 分支（即你要求的"推送到远程后自动部署"）
name: 🚀 Deploy VitePress site to GitHub Pages

on:
  # 推送到 main 分支时自动运行（如需其他分支请修改）
  push:
    branches: [main]
  # 允许从 Actions 选项卡手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限，允许推送 gh-pages 分支
permissions:
  contents: write

jobs:
  # 构建并部署到 gh-pages 分支
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # 启用 lastUpdated / Git 变更日志需要完整历史

      - name: 🔧 Enable Corepack
        # 启用 corepack，自动使用 package.json 中 packageManager 锁定的 pnpm 版本（当前 10.3.0）
        run: corepack enable

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build with VitePress
        run: pnpm docs:build

      - name: 🚀 Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true # 每次重建干净的 gh-pages 分支，避免历史膨胀
